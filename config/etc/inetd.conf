# inetd.conf — NanOS internet super-server configuration (GNU inetutils inetd).
# Started at boot (daemonized) as:
#   inetd --pidfile=/tmp/inetd.pid /disks/main/nanos/config/etc/inetd.conf
# (the on-disk system config lives under /disks/main/nanos/config, NanOS's /etc).
# Fields: service  socket-type  proto  wait/nowait  user  server-program  args...
# The "internal" services (echo/discard/daytime/chargen) are handled by inetd itself —
# no external binary. Service name -> port is resolved through /etc/services.
echo		stream	tcp	nowait	root	internal
echo		dgram	udp	wait	root	internal
discard		stream	tcp	nowait	root	internal
discard		dgram	udp	wait	root	internal
daytime		stream	tcp	nowait	root	internal
daytime		dgram	udp	wait	root	internal
chargen		stream	tcp	nowait	root	internal
chargen		dgram	udp	wait	root	internal
# telnet -> inetutils telnetd over a kernel pty. telnetd execs nanologin, which sets up a Unix
# login environment and execs the account's shell (getpwuid->pw_shell, like the console). The
# --exec-login override replaces telnetd's default /usr/local login template (no %-flags in the
# value = telnetd execs nanologin with argv[0] only).
telnet		stream	tcp	nowait	root	/disks/main/nanos/bin/telnetd.nxe telnetd --exec-login=/disks/main/nanos/bin/nanologin.nxe
