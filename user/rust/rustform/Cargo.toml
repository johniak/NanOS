# rustform — a nanowm demo app written in Rust, built against the C-ABI libnwui via the
# `nanos` SDK module. Compiled for the bare i686-nanos target (no SSE, soft-float) with
# cargo -Z build-std=core,alloc, as a staticlib our linker combines with crt0 + the .ndl
# import libraries, then mknx turns into a .nxe. No external dependencies (offline build).
[package]
name = "rustform"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"
crate-type = ["staticlib"]

[profile.release]
panic = "abort"
opt-level = "z"

[profile.dev]
panic = "abort"
