<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NanOS</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; background:#0a1020; color:#e8eef8;
         margin:0; display:flex; min-height:100vh; align-items:center; justify-content:center; }
  .card { text-align:center; padding:3rem 4rem; border-radius:16px;
          background:rgba(255,255,255,0.04); box-shadow:0 8px 40px rgba(0,0,0,0.4); }
  h1 { margin:0 0 .3rem; font-size:2.4rem; letter-spacing:.04em; }
  p  { margin:.2rem 0; opacity:.8; }
  code { background:rgba(255,255,255,0.08); padding:.15rem .4rem; border-radius:5px; }
</style>
</head>
<body>
  <div class="card">
    <h1>NanOS</h1>
    <p>Served by <code>darkhttpd</code> on a tiny i686 kernel.</p>
    <p>TCP/IP, DHCP, telnet and HTTP — all home-grown.</p>
  </div>
</body>
</html>
